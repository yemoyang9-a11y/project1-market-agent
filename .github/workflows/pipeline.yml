name: Market Intelligence Daily Pipeline

on:
  schedule:
    # 매일 한국 시간 09:00 (UTC 00:00) 자동 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # GitHub 웹 UI에서 수동 트리거

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run End-to-End Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENABLE_LLM_RELEVANCE: ${{ secrets.ENABLE_LLM_RELEVANCE || 'false' }}
        run: |
          python src/run_pipeline.py

      - name: Commit and push updated data & report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/ logs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(auto): update market news intelligence [skip ci]"
            git push
          fi
